version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.10
    steps:
      - checkout

      - run:
          name: Install uv
          command: curl -LsSf https://astral.sh/uv/install.sh | sh

      - run:
          name: Install Dependencies
          command: uv sync

      - run:
          name: Cleanup old coverage data
          command: |
            uv run coverage erase
            rm -f .coverage*

      - run:
          name: Run Static Analysis
          command: |
            uv run mypy src tests
            uv run ruff check .

      - run:
          name: Run Unit Tests with Coverage
          command: |
            mkdir -p test-results/unit
            COVERAGE_FILE=.coverage.unit uv run nose2 -v -s tests/unit/ --with-coverage --coverage=src --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/unit/results.xml

      - run:
          name: Run Integration Tests
          command: |
            mkdir -p test-results/integration
            COVERAGE_FILE=.coverage.integration uv run nose2 -s tests/integration/ --with-coverage --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/integration/results.xml

      - run:
          name: Run End-to-End Tests
          command: |
            mkdir -p test-results/e2e
            COVERAGE_FILE=.coverage.e2e uv run nose2 -s tests/e2e/ --with-coverage --plugin=nose2.plugins.junitxml --junit-xml-path=test-results/e2e/results.xml

      - run:
          name: Combine Coverage Reports
          command: |
            mkdir -p coverage-reports
            uv run coverage combine .coverage.unit .coverage.integration .coverage.e2e
            cp .coverage coverage-reports/combined.coverage
            uv run coverage report --fail-under=70
            uv run coverage xml -o coverage-reports/coverage.xml
            uv run coverage html -d coverage-reports/html

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: coverage-reports
          destination: coverage

workflows:
  main:
    jobs:
      - build-and-test